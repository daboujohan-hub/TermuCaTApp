<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EduMap — San Pedro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
:root {
  --or: #F5A623;
  --vert: #00E5A0;
  --rouge: #FF4B6E;
  --bleu: #1A1F3C;
  --noir: #0A0C1B;
  --gris: #1E2340;
  --gris2: #2A2F52;
  --texte: #E8EAF6;
  --texte2: #8B90B8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--noir);
  color: var(--texte);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(245,166,35,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,229,160,0.05) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.header {
  position: relative; z-index: 10;
  padding: 28px 20px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.logo { display: flex; align-items: center; gap: 12px; }

.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--or), #FF8C00);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 20px rgba(245,166,35,0.35);
  animation: pulse-logo 3s ease-in-out infinite;
}

@keyframes pulse-logo {
  0%, 100% { box-shadow: 0 4px 20px rgba(245,166,35,0.35); }
  50% { box-shadow: 0 4px 35px rgba(245,166,35,0.6); }
}

.logo-text {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
  line-height: 1;
}

.logo-text span {
  display: block;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--texte2);
  margin-top: 2px;
}

.btn-loc {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: rgba(245,166,35,0.1);
  border: 1px solid rgba(245,166,35,0.3);
  border-radius: 50px;
  color: var(--or);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-loc:hover { background: rgba(245,166,35,0.2); border-color: var(--or); }
.btn-loc.actif { background: var(--or); color: var(--noir); border-color: var(--or); }

.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--or);
  animation: blink 1.5s ease-in-out infinite;
}

.btn-loc.actif .dot { background: var(--noir); }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.stats {
  position: relative; z-index: 10;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 16px 16px 0;
}

.stat {
  background: var(--gris);
  border-radius: 14px;
  padding: 14px 12px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.05);
}

.stat-num {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 26px;
  line-height: 1;
  background: linear-gradient(135deg, var(--or), #FF8C00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-label {
  font-size: 11px;
  color: var(--texte2);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.search-wrap {
  position: relative; z-index: 10;
  padding: 16px;
}

.search-inner { position: relative; }

.search-icon {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  opacity: 0.5;
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 14px 16px 14px 44px;
  background: var(--gris);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  color: var(--texte);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  outline: none;
  transition: all 0.3s;
}

.search-input::placeholder { color: var(--texte2); }
.search-input:focus {
  border-color: rgba(245,166,35,0.5);
  background: var(--gris2);
  box-shadow: 0 0 0 3px rgba(245,166,35,0.08);
}

.map-wrap {
  position: relative; z-index: 10;
  padding: 0 16px 16px;
}

.map-container {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

#map { height: 280px; width: 100%; }
#map .leaflet-tile-pane {
  filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.7);
}

.map-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: linear-gradient(to top, var(--noir), transparent);
  pointer-events: none;
  z-index: 400;
}

.filtres-wrap {
  position: relative; z-index: 10;
  padding: 0 16px 12px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filtres-wrap::-webkit-scrollbar { display: none; }

.filtre-pill {
  padding: 7px 16px;
  border-radius: 50px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: var(--texte2);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.25s;
}

.filtre-pill:hover { border-color: var(--or); color: var(--or); }
.filtre-pill.active {
  background: linear-gradient(135deg, var(--or), #FF8C00);
  border-color: transparent;
  color: var(--noir);
  font-weight: 600;
  box-shadow: 0 4px 15px rgba(245,166,35,0.3);
}

.section-titre {
  position: relative; z-index: 10;
  padding: 0 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-titre h2 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 18px;
}

.section-titre span { font-size: 13px; color: var(--texte2); }

.ecoles-liste {
  position: relative; z-index: 10;
  padding: 0 16px 100px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ecole-card {
  background: var(--gris);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.25s;
  animation: fadeUp 0.4s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.ecole-card:hover {
  background: var(--gris2);
  border-color: rgba(245,166,35,0.2);
  transform: translateX(4px);
}

.ecole-avatar {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.avatar-lycee   { background: rgba(106,180,255,0.15); }
.avatar-college { background: rgba(106,255,106,0.12); }
.avatar-epp     { background: rgba(255,106,106,0.12); }
.avatar-epc     { background: rgba(255,180,106,0.12); }
.avatar-autre   { background: rgba(192,106,255,0.12); }

.ecole-body { flex: 1; min-width: 0; }

.ecole-nom {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 14px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ecole-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
  flex-wrap: wrap;
}

.ecole-quartier { font-size: 12px; color: var(--texte2); }

.ecole-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.badge-lycee   { background: rgba(106,180,255,0.15); color: #6ab4ff; }
.badge-college { background: rgba(106,255,106,0.12); color: #6aff6a; }
.badge-epp     { background: rgba(255,106,106,0.12); color: #ff6a6a; }
.badge-epc     { background: rgba(255,180,106,0.12); color: #ffb46a; }
.badge-autre   { background: rgba(192,106,255,0.12); color: #c06aff; }

.ecole-dist { font-size: 11px; color: var(--vert); font-weight: 600; }

.ecole-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}

.btn-nav {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
}

.btn-nav-go {
  background: linear-gradient(135deg, var(--or), #FF8C00);
  box-shadow: 0 4px 12px rgba(245,166,35,0.3);
}

.btn-nav-go:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(245,166,35,0.5); }

.btn-nav-map {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--texte2);
}

.btn-nav-map:hover { background: rgba(255,255,255,0.12); color: var(--texte); }

.vide { text-align: center; padding: 50px 20px; color: var(--texte2); }
.vide-icon { font-size: 48px; margin-bottom: 12px; }
.vide p { font-size: 15px; }

.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--gris2);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--texte);
  padding: 12px 22px;
  border-radius: 50px;
  font-size: 14px;
  z-index: 9999;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.toast.show { transform: translateX(-50%) translateY(0); }

.leaflet-container { background: #111520; }
.leaflet-popup-content-wrapper {
  background: var(--gris2) !important;
  color: var(--texte) !important;
  border-radius: 14px !important;
  border: 1px solid rgba(255,255,255,0.1) !important;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important;
}
.leaflet-popup-tip { background: var(--gris2) !important; }
.leaflet-popup-content { margin: 14px 16px !important; }
.admin-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 5000;
  align-items: flex-end;
  justify-content: center;
}
.admin-backdrop.show { display: flex; }
.admin-sheet {
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  background: var(--gris);
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  padding: 24px 20px 32px;
  border: 1px solid rgba(255,255,255,0.08);
}
.admin-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
  margin-bottom: 16px;
}
.admin-input {
  width: 100%;
  padding: 13px 14px;
  background: var(--gris2);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  color: var(--texte);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  margin-bottom: 10px;
  outline: none;
}
.admin-input::placeholder { color: var(--texte2); }
.admin-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--or), #FF8C00);
  border: none;
  border-radius: 12px;
  color: var(--noir);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  margin-top: 6px;
}
.admin-erreur { color: #ff6a6a; font-size: 13px; margin: -4px 0 10px; }
.admin-photo-preview {
  width: 100%; height: 140px;
  border-radius: 12px;
  background: var(--gris2);
  margin-bottom: 10px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  color: var(--texte2);
  font-size: 13px;
  cursor: pointer;
}
.admin-photo-preview img { width: 100%; height: 100%; object-fit: cover; }
.admin-close { text-align: center; color: var(--texte2); font-size: 13px; margin-top: 14px; cursor: pointer; }
.ecole-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">🏫</div>
    <div class="logo-text">
      EduMap
      <span>San Pedro · Côte d'Ivoire</span>
    </div>
  </div>
  <button class="btn-loc" id="btn-loc" onclick="maPosition()">
    <div class="dot"></div>
    Me localiser
  </button>
</header>

<div class="stats">
  <div class="stat">
    <div class="stat-num" id="stat-total">0</div>
    <div class="stat-label">Écoles</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="stat-quartiers">0</div>
    <div class="stat-label">Quartiers</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="stat-affichees">0</div>
    <div class="stat-label">Résultats</div>
  </div>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" type="text"
      placeholder="Rechercher une école, un quartier..."
      oninput="filtrer()">
  </div>
</div>

<div class="map-wrap">
  <div class="map-container">
    <div id="map"></div>
    <div class="map-overlay"></div>
  </div>
</div>

<div class="filtres-wrap" id="filtres"></div>

<div class="section-titre">
  <h2>Toutes les écoles</h2>
  <span id="compteur">0 résultats</span>
</div>

<div class="ecoles-liste" id="liste"></div>

<div class="toast" id="toast">
  <span id="toast-icon">✅</span>
  <span id="toast-msg"></span>
</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const ecoles = [
  { nom: "Collège Moderne Digboué",      quartier: "Djiby",   lat: 4.755587, lng: -6.693444 },
  { nom: "EPP Enfant José",               quartier: "Rouge",   lat: 4.766807, lng: -6.660527 },
  { nom: "École Grand Badoo",             quartier: "Badoo",   lat: 4.771501, lng: -6.655521 },
  { nom: "EPC Assemblée de Dieu 2",       quartier: "Colas",   lat: 4.777972, lng: -6.664504 },
  { nom: "Lycée Moderne Lucien Yebarth",  quartier: "Centre",  lat: 4.761371, lng: -6.680899 },
  { nom: "EPP San Pedro Centre",          quartier: "Centre",  lat: 4.748500, lng: -6.636700 },
  { nom: "EPP Bardot",                    quartier: "Bardot",  lat: 4.758900, lng: -6.671300 },
  { nom: "Lycée Municipal de San Pedro",  quartier: "Séwéké",  lat: 4.744600, lng: -6.628900 },
  { nom: "EPC Emmanuel",                  quartier: "Séwéké",  lat: 4.746100, lng: -6.631400 },
];

let maPos = null, maPosMarker = null, filtreActif = "Tous", markers = [], resultats = [...ecoles];

const map = L.map('map', { zoomControl: false }).setView([4.758, -6.665], 13);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

const TYPE_EMOJI  = { lycee:'🎓', college:'📚', epp:'✏️', epc:'⛪', autre:'🏫' };
const TYPE_LABEL  = { lycee:'Lycée', college:'Collège', epp:'EPP', epc:'EPC', autre:'École' };
const TYPE_COLOR  = { lycee:'#6ab4ff', college:'#6aff6a', epp:'#ff6a6a', epc:'#ffb46a', autre:'#c06aff' };

function getType(nom) {
  const n = nom.toLowerCase();
  if (n.includes('lycée') || n.includes('lycee')) return 'lycee';
  if (n.includes('collège') || n.includes('college')) return 'college';
  if (n.includes('epp')) return 'epp';
  if (n.includes('epc')) return 'epc';
  return 'autre';
}

function dist(lat1,lon1,lat2,lon2) {
  const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function fmtDist(m) { return m<1000 ? `${m} m` : `${(m/1000).toFixed(1)} km`; }

function markerIcon(type) {
  const c = TYPE_COLOR[type];
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${c};border:3px solid rgba(255,255,255,0.8);box-shadow:0 0 0 4px ${c}44,0 2px 10px rgba(0,0,0,0.5)"></div>`,
    iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-12]
  });
}

// ===== Photos à la demande, galerie, plein écran (afficher_photos_ecoles.py) =====
let courant = [];
let ioPhotos = null;
let lbEtat = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// <<LOGIQUE_PHOTOS
const photoCache = {};
const filePhotos = [];
let photoEnCours = null, photoTimer = null;

function b64ok(s) { return typeof s === 'string' && s.length > 0 && /^[A-Za-z0-9+\/=]+$/.test(s); }
function cacheDe(id) { return photoCache[id] || (photoCache[id] = { imgs: [], pend: {}, echec: {} }); }

function demanderPhoto(id, index, prio) {
  if (!id) return;
  const c = cacheDe(id);
  if (c.imgs[index] || c.pend[index] || c.echec[index]) return;
  c.pend[index] = true;
  if (prio) filePhotos.unshift({ id: id, index: index }); else filePhotos.push({ id: id, index: index });
  suivantePhoto();
}

function suivantePhoto() {
  if (photoEnCours || !filePhotos.length) return;
  photoEnCours = filePhotos.shift();
  const t = photoEnCours;
  envoyerAuNatif({ type: 'edumap_photo_request', id: t.id, index: t.index });
  clearTimeout(photoTimer);
  photoTimer = setTimeout(function () {
    if (photoEnCours !== t) return;
    photoEnCours = null;
    const c = cacheDe(t.id);
    delete c.pend[t.index];
    c.echec[t.index] = true;
    majPhotosUI(t.id);
    suivantePhoto();
  }, 15000);
}

window.edumapPhotoResultat = function (jsonStr) {
  let r = null;
  try { r = JSON.parse(jsonStr); } catch (e) {}
  if (r && r.id !== undefined) {
    const c = cacheDe(r.id);
    delete c.pend[r.index];
    if (r.ok && b64ok(r.photo_base64)) { c.imgs[r.index] = r.photo_base64; delete c.echec[r.index]; }
    else c.echec[r.index] = true;
    if (photoEnCours && photoEnCours.id === r.id && photoEnCours.index === r.index) {
      photoEnCours = null;
      clearTimeout(photoTimer);
    }
    majPhotosUI(r.id);
  }
  suivantePhoto();
};
// LOGIQUE_PHOTOS>>

function nbPhotos(id) {
  const e = ecoles.find(function (x) { return x.id === id; });
  return e ? (e.nb || 0) : 0;
}

function rendreGalerie(el, id) {
  const n = nbPhotos(id);
  const c = photoCache[id] || { imgs: [], pend: {}, echec: {} };
  if (!n) { el.innerHTML = ''; return; }
  let h = '';
  for (let i = 0; i < n; i++) {
    if (b64ok(c.imgs[i])) h += '<img class="gal-img" onclick="lbOuvrir(\'' + id + '\',' + i + ')" src="data:image/jpeg;base64,' + c.imgs[i] + '">';
    else if (c.echec[i]) h += '<div class="gal-ph">⚠️<span>Photo indisponible</span></div>';
    else h += '<div class="gal-ph"><div class="gal-spin"></div></div>';
  }
  el.innerHTML = h;
}

function majPhotosUI(id) {
  const sel = String(id).replace(/"/g, '');
  document.querySelectorAll('[data-gal="' + sel + '"]').forEach(function (el) { rendreGalerie(el, id); });
  const c = photoCache[id];
  document.querySelectorAll('[data-av="' + sel + '"]').forEach(function (el) {
    if (c && b64ok(c.imgs[0])) el.innerHTML = '<img src="data:image/jpeg;base64,' + c.imgs[0] + '">';
  });
  if (lbEtat && lbEtat.id === id) lbAfficher();
}

function lbOuvrir(id, i) {
  lbEtat = { id: id, i: i };
  document.getElementById('lb').classList.add('show');
  lbAfficher();
}
function lbFermer() {
  lbEtat = null;
  document.getElementById('lb').classList.remove('show');
}
function lbAller(d) {
  if (!lbEtat) return;
  const n = nbPhotos(lbEtat.id);
  if (!n) return;
  lbEtat.i = (lbEtat.i + d + n) % n;
  lbAfficher();
}
function lbAfficher() {
  if (!lbEtat) return;
  const n = nbPhotos(lbEtat.id);
  const c = photoCache[lbEtat.id];
  const b = c && c.imgs[lbEtat.i];
  const img = document.getElementById('lb-img');
  if (b64ok(b)) { img.src = 'data:image/jpeg;base64,' + b; img.style.display = 'block'; }
  else { img.removeAttribute('src'); img.style.display = 'none'; demanderPhoto(lbEtat.id, lbEtat.i, true); }
  document.getElementById('lb-count').textContent = (lbEtat.i + 1) + ' / ' + n;
  document.getElementById('lb-prev').style.visibility = n > 1 ? 'visible' : 'hidden';
  document.getElementById('lb-next').style.visibility = n > 1 ? 'visible' : 'hidden';
}

function naviguerIdx(i) {
  const e = courant[i];
  if (e) naviguer(e.lat, e.lng, e.nom);
}

function afficher(data) {
  courant = data;
  const liste = document.getElementById('liste');
  liste.innerHTML = '';
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (ioPhotos) { ioPhotos.disconnect(); ioPhotos = null; }
  document.getElementById('stat-affichees').textContent = data.length;
  document.getElementById('compteur').textContent = `${data.length} résultat${data.length > 1 ? 's' : ''}`;

  if (!data.length) {
    liste.innerHTML = `<div class="vide"><div class="vide-icon">🔍</div><p>Aucune école trouvée</p></div>`;
    return;
  }

  if ('IntersectionObserver' in window) {
    ioPhotos = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (en) {
        if (en.isIntersecting) {
          ioPhotos.unobserve(en.target);
          demanderPhoto(en.target.getAttribute('data-av'), 0, false);
        }
      });
    }, { rootMargin: '150px' });
  }

  data.forEach((e, i) => {
    if (!e.id) e.id = 'seed_' + ecoles.indexOf(e);
    if (e.nb === undefined) {
      const inline = Array.isArray(e.photos) ? e.photos.filter(b64ok) : [];
      if (inline.length) { const c0 = cacheDe(e.id); inline.forEach(function (b, j) { c0.imgs[j] = b; }); }
      e.nb = inline.length;
    }
    const type = getType(e.nom);
    const d = maPos ? dist(maPos.lat, maPos.lng, e.lat, e.lng) : null;
    const c = photoCache[e.id];
    const miniature = (c && b64ok(c.imgs[0])) ? `<img src="data:image/jpeg;base64,${c.imgs[0]}">` : TYPE_EMOJI[type];
    const card = document.createElement('div');
    card.className = 'ecole-card';
    card.style.animationDelay = `${i * 0.05}s`;
    card.innerHTML = `
      <div class="ecole-avatar avatar-${type}" data-av="${esc(e.id)}"${e.nb ? ` onclick="lbOuvrir('${esc(e.id)}',0)"` : ''}>${miniature}</div>
      <div class="ecole-body">
        <div class="ecole-nom">${esc(e.nom)}</div>
        <div class="ecole-meta">
          <span class="ecole-quartier">📍 ${esc(e.quartier)}</span>
          <span class="ecole-badge badge-${type}">${TYPE_LABEL[type]}</span>
          ${d !== null ? `<span class="ecole-dist">📏 ${fmtDist(d)}</span>` : ''}
          ${e.nb ? `<span class="ecole-dist">📷 ${e.nb}</span>` : ''}
        </div>
      </div>
      <div class="ecole-actions">
        <button class="btn-nav btn-nav-go" onclick="naviguerIdx(${i})">🧭</button>
        <button class="btn-nav btn-nav-map" onclick="centrer(${i})">🗺</button>
      </div>`;
    liste.appendChild(card);
    const av = card.querySelector('[data-av]');
    if (e.nb && ioPhotos) ioPhotos.observe(av);
    else if (e.nb && i < 8) demanderPhoto(e.id, 0, false);

    const mk = L.marker([e.lat, e.lng], { icon: markerIcon(type) }).addTo(map);
    mk.bindPopup(`<div style="font-family:'DM Sans',sans-serif">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px">${TYPE_EMOJI[type]} ${esc(e.nom)}</div>
      <div style="font-size:12px;color:#8B90B8;margin-bottom:10px">📍 ${esc(e.quartier)}</div>
      ${e.nb ? `<div class="gal" data-gal="${esc(e.id)}"></div><div class="gal-hint">${e.nb} photo${e.nb > 1 ? 's' : ''} · touche une photo pour l'agrandir</div>` : ''}
      <button onclick="naviguerIdx(${i})"
        style="width:100%;padding:8px;background:linear-gradient(135deg,#F5A623,#FF8C00);color:#0A0C1B;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">
        🧭 Y aller
      </button></div>`, { minWidth: 230, maxWidth: 260 });
    mk.on('popupopen', function (ev) {
      if (!e.nb) return;
      const el = ev.popup.getElement().querySelector('[data-gal]');
      if (el) rendreGalerie(el, e.id);
      for (let k = 0; k < e.nb; k++) demanderPhoto(e.id, k, true);
    });
    markers.push(mk);
  });
}
function genFiltres() {
  const quartiers = ['Tous', ...new Set(ecoles.map(e => e.quartier))];
  const wrap = document.getElementById('filtres');
  wrap.innerHTML = '';
  quartiers.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'filtre-pill' + (q === 'Tous' ? ' active' : '');
    btn.textContent = q === 'Tous' ? '🏙 Tous' : q;
    btn.onclick = () => {
      filtreActif = q;
      document.querySelectorAll('.filtre-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtrer();
    };
    wrap.appendChild(btn);
  });
  document.getElementById('stat-quartiers').textContent = quartiers.length - 1;
}

function filtrer() {
  const val = document.getElementById('search').value.toLowerCase();
  resultats = ecoles.filter(e => {
    const ok1 = e.nom.toLowerCase().includes(val) || e.quartier.toLowerCase().includes(val);
    const ok2 = filtreActif === 'Tous' || e.quartier === filtreActif;
    return ok1 && ok2;
  });
  if (maPos) resultats.sort((a,b) => dist(maPos.lat,maPos.lng,a.lat,a.lng) - dist(maPos.lat,maPos.lng,b.lat,b.lng));
  afficher(resultats);
}

function maPosition() {
  toast('📡','Localisation en cours…');
  envoyerAuNatif({ type: 'geoloc_request', contexte: 'utilisateur' });
}

window.edumapPositionResultat = function(contexte, lat, lng) {
  if (contexte === 'utilisateur') {
    maPos = { lat, lng };
    if (maPosMarker) map.removeLayer(maPosMarker);
    maPosMarker = L.circleMarker([lat,lng],{
      radius:8, color:'#F5A623', fillColor:'#F5A623', fillOpacity:1, weight:3
    }).addTo(map).bindPopup('<b style="color:#F5A623">📡 Vous êtes ici</b>').openPopup();
    map.setView([lat,lng],14);
    document.getElementById('btn-loc').classList.add('actif');
    toast('✅','Position trouvée !');
    filtrer();
  }
};

window.edumapPositionErreur = function(contexte) {
  if (contexte === 'utilisateur') {
    toast('❌','Impossible de vous localiser');
  }
};

function centrer(i) {
  const e = resultats[i];
  map.setView([e.lat,e.lng],16);
  markers[i].openPopup();
  window.scrollTo({ top: document.querySelector('.map-wrap').offsetTop - 10, behavior: 'smooth' });
}

function naviguer(lat,lng,nom) {
  toast('🧭',`Navigation vers ${nom}`);
  setTimeout(() => envoyerAuNatif({ type: 'open_maps', lat: lat, lng: lng }), 900);
}

let toastTimer;
function toast(icon,msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-icon').textContent = icon;
  document.getElementById('toast-msg').textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ─── Pont natif (React Native WebView) ─────────────
function envoyerAuNatif(msg) {
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  }
}

window.edumapListeResultat = function(jsonStr) {
  try {
    const res = JSON.parse(jsonStr);
    if (res.ok && Array.isArray(res.ecoles)) {
      res.ecoles.forEach(function (e, k) {
        if (!e || typeof e.nom !== 'string') return;
        const lat = Number(e.lat), lng = Number(e.lng);
        if (!isFinite(lat) || !isFinite(lng)) return;
        const quartier = String(e.quartier || '');
        if (ecoles.some(x => x.nom === e.nom && x.quartier === quartier)) return;
        const id = (typeof e.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(e.id)) ? e.id : ('loc' + ecoles.length + '_' + k);
        const inline = Array.isArray(e.photos_base64) ? e.photos_base64.filter(b64ok) : [];
        if (inline.length) { const c = cacheDe(id); inline.forEach(function (b, j) { c.imgs[j] = b; }); }
        const nb = Math.min(10, Math.max(Number(e.nb_photos) || 0, inline.length));
        ecoles.push({ id: id, nom: e.nom, quartier: quartier, lat: lat, lng: lng, nb: nb });
      });
      document.getElementById('stat-total').textContent = ecoles.length;
      genFiltres();
      filtrer();
    }
  } catch (err) {}
};

document.getElementById('stat-total').textContent = ecoles.length;
genFiltres();
filtrer();
envoyerAuNatif({ type: 'edumap_list_request' });
</script>

<button id="prop-btn" type="button" onclick="ouvrirProposition()">＋ Proposer une école</button>
<div id="prop-backdrop">
  <div id="prop-sheet">
    <h3>🏫 Proposer une école</h3>
    <p class="note">Ta proposition sera vérifiée avant d'être publiée. Photographie uniquement le bâtiment, sans visage d'élèves ni de personnes.</p>
    <input id="prop-nom" type="text" maxlength="120" placeholder="Nom exact de l'école">
    <input id="prop-quartier" type="text" maxlength="120" placeholder="Quartier / adresse">
    <div id="prop-gps">📡 Position GPS : en attente…</div>
    <div id="prop-photos"></div>
    <div id="prop-msg"></div>
    <button id="prop-send" type="button" onclick="soumettreProposition()">Envoyer la proposition</button>
    <div id="prop-close" onclick="fermerProposition()">Annuler</div>
  </div>
</div>
<script>
(function () {
  var MAX_PHOTOS = 4;
  var MIN_PHOTOS = 4;
  var pos = null, photos = [], envoi = false;
  var $ = function (id) { return document.getElementById(id); };

  function message(texte, erreur) {
    var e = $('prop-msg');
    e.textContent = texte || '';
    e.style.display = texte ? 'block' : 'none';
    e.style.color = erreur ? '#ff6a6a' : '#7ee787';
  }

  function rendrePhotos() {
    var zone = $('prop-photos');
    zone.innerHTML = '';
    photos.forEach(function (p, i) {
      var d = document.createElement('div');
      d.className = 'prop-ph';
      var img = document.createElement('img');
      img.src = 'data:image/jpeg;base64,' + p.b64;
      var x = document.createElement('div');
      x.className = 'x';
      x.textContent = '×';
      x.onclick = function () { photos.splice(i, 1); rendrePhotos(); };
      d.appendChild(img);
      d.appendChild(x);
      zone.appendChild(d);
    });
    if (photos.length < MAX_PHOTOS) {
      var plus = document.createElement('div');
      plus.className = 'prop-ph';
      plus.textContent = '+';
      plus.onclick = function () {
        window.__photosCible = 'proposition';
        envoyerAuNatif({ type: 'edumap_pick_photos', restant: MAX_PHOTOS - photos.length });
      };
      zone.appendChild(plus);
    }
  }

  function typeImage(b64) {
    if (b64.indexOf('iVBOR') === 0) return 'image/png';
    if (b64.indexOf('UklGR') === 0) return 'image/webp';
    if (b64.indexOf('R0lGO') === 0) return 'image/gif';
    return 'image/jpeg';
  }

  function compresser(b64) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1280 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k));
        c.height = Math.max(1, Math.round(img.height * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var q = 0.7;
        var out = c.toDataURL('image/jpeg', q).split(',')[1];
        while (out.length * 0.75 > 500 * 1024 && q > 0.3) {
          q -= 0.1;
          out = c.toDataURL('image/jpeg', q).split(',')[1];
        }
        resolve(out);
      };
      img.onerror = function () { resolve(null); };
      img.src = 'data:' + typeImage(b64) + ';base64,' + b64;
    });
  }

  function tailleOctets(b64) {
    var pad = b64.slice(-2) === '==' ? 2 : (b64.slice(-1) === '=' ? 1 : 0);
    return b64.length * 3 / 4 - pad;
  }

  window.ouvrirProposition = function () {
    pos = null; photos = []; envoi = false;
    $('prop-nom').value = '';
    $('prop-quartier').value = '';
    $('prop-send').disabled = false;
    $('prop-send').textContent = 'Envoyer la proposition';
    message('');
    rendrePhotos();
    $('prop-gps').textContent = '📡 Position GPS : recherche…';
    $('prop-backdrop').classList.add('show');
    envoyerAuNatif({ type: 'geoloc_request', contexte: 'proposition' });
  };

  window.fermerProposition = function () {
    window.__photosCible = null;
    $('prop-backdrop').classList.remove('show');
  };

  window.soumettreProposition = function () {
    if (envoi) return;
    var nom = $('prop-nom').value.trim();
    var quartier = $('prop-quartier').value.trim();
    if (nom.length < 3) { message("Saisis le nom exact de l'école.", true); return; }
    if (!quartier) { message('Indique le quartier ou l\'adresse.', true); return; }
    if (!pos) { message('Position GPS indisponible : active le GPS puis rouvre ce formulaire depuis l\'école.', true); return; }
    if (photos.length < MIN_PHOTOS) { message('Ajoute ' + MIN_PHOTOS + ' photos de l\'école (' + photos.length + '/' + MIN_PHOTOS + ').', true); return; }
    envoi = true;
    $('prop-send').disabled = true;
    $('prop-send').textContent = 'Envoi…';
    message('');
    envoyerAuNatif({
      type: 'edumap_propose',
      payload: {
        nom: nom, quartier: quartier, lat: pos.lat, lng: pos.lng,
        photos: photos.map(function (p) { return p.b64; }),
        photos_tailles: photos.map(function (p) { return p.taille; })
      }
    });
  };

  window.edumapPropositionResultat = function (donnees) {
    var r = null;
    try { r = typeof donnees === 'string' ? JSON.parse(donnees) : donnees; } catch (e) {}
    envoi = false;
    $('prop-send').disabled = false;
    $('prop-send').textContent = 'Envoyer la proposition';
    if (r && r.ok) {
      message('Merci ! Ta proposition a été envoyée. Elle sera vérifiée avant publication.', false);
      $('prop-send').disabled = true;
      setTimeout(window.fermerProposition, 2800);
    } else {
      message((r && r.msg) || 'Erreur : proposition non envoyée.', true);
    }
  };

  var posOrig = window.edumapPositionResultat;
  window.edumapPositionResultat = function (contexte, lat, lng) {
    if (contexte === 'proposition') {
      pos = { lat: lat, lng: lng };
      $('prop-gps').textContent = '✅ Position GPS trouvée';
      return;
    }
    if (posOrig) return posOrig.apply(this, arguments);
  };

  var erreurOrig = window.edumapPositionErreur;
  window.edumapPositionErreur = function (contexte) {
    if (contexte === 'proposition') {
      pos = null;
      $('prop-gps').textContent = '⚠️ Position indisponible. Active le GPS et autorise la localisation.';
      return;
    }
    if (erreurOrig) return erreurOrig.apply(this, arguments);
  };

  var photosOrig = window.edumapPhotosResultat;
  window.edumapPhotosResultat = function (donnees) {
    if (window.__photosCible !== 'proposition') {
      if (!photosOrig) return;
      var contexteAppel = this, brut = [];
      try { brut = typeof donnees === 'string' ? JSON.parse(donnees) : donnees; } catch (e) {}
      if (!Array.isArray(brut) || !brut.length) return photosOrig.call(contexteAppel, donnees);
      var prepares = [];
      brut.reduce(function (suite, b64) {
        return suite.then(function () {
          return compresser(b64).then(function (out) { if (out) prepares.push(out); });
        });
      }, Promise.resolve()).then(function () {
        if (prepares.length < brut.length && typeof toast === 'function') toast('⚠️', "Une photo n'a pas pu être lue.");
        photosOrig.call(contexteAppel, JSON.stringify(prepares));
      });
      return;
    }
    window.__photosCible = null;
    var liste = [];
    try { liste = typeof donnees === 'string' ? JSON.parse(donnees) : donnees; } catch (e) {}
    if (!Array.isArray(liste)) liste = [];
    var place = MAX_PHOTOS - photos.length;
    liste.slice(0, place).reduce(function (suite, b64) {
      return suite.then(function () {
        return compresser(b64).then(function (out) {
          if (out) photos.push({ b64: out, taille: tailleOctets(out) }); else message("Une photo n'a pas pu être lue (format non pris en charge).", true);
        });
      });
    }, Promise.resolve()).then(rendrePhotos);
  };

  rendrePhotos();
})();
</script>

<script>
(function () {
  var lb = document.getElementById('lb'), x0 = null;
  lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) lbAller(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
</script>

<script>
(function () {
  var btn = document.getElementById('prop-btn');
  var ab = document.getElementById('admin-backdrop');
  function maj() { if (btn) btn.style.display = (ab && ab.classList.contains('show')) ? 'none' : ''; }
  if (ab && window.MutationObserver) new MutationObserver(maj).observe(ab, { attributes: true, attributeFilter: ['class'] });
  maj();
})();
</script>

<style>/* admin retiré de l'app : l'administration se fait via l'application administrateur */
.admin-backdrop,#admin-backdrop{display:none !important}</style>
</body>
